services:
  docs-dev:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    profiles: ["dev"]

  docs-prod:
    build:
      context: .
      target: prod
    ports:
      - "3000:3000"
    profiles: ["prod"]
